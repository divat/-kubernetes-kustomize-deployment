apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: product-order-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: dev.local
      http:
        paths:
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: product-api-service
                port:
                  number: 8084
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 8085
